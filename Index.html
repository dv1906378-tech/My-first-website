
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Political Science | Study Portal</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
      line-height: 1.6;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #172554, #2563eb);
      color: white;
      padding: 18px 7%;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 3px 15px rgba(0,0,0,0.2);
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
      font-size: 14px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* Hero */
    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        linear-gradient(rgba(23,37,84,0.88), rgba(37,99,235,0.88)),
        radial-gradient(circle at top, #60a5fa, #172554);
      color: white;
    }

    .hero h1 {
      font-size: 44px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #facc15;
    }

    .hero p {
      font-size: 18px;
      max-width: 650px;
      margin: auto;
      opacity: 0.95;
    }

    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 13px 25px;
      background: #facc15;
      color: #172554;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    }

    /* Sections */
    section {
      padding: 70px 7%;
    }

    .title {
      text-align: center;
      margin-bottom: 40px;
    }

    .title h2 {
      font-size: 32px;
      color: #172554;
    }

    .title p {
      color: #666;
      margin-top: 8px;
    }
